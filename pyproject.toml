[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "zapind"
version = "1.0.1"
description = "Developer-friendly, async-first, type-safe contextual Zalo SDK for Python."
readme = "README.md"
license = { text = "LGPL-3.0-only" }
requires-python = ">=3.10"
authors = [
  { name = "nquangdungg" },
]
keywords = ["zalo", "zapind", "zalo-sdk", "zalo-bot", "asyncio", "sdk"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
crypto = ["cryptography>=42.0.0"]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
  "build>=1.2.0",
  "cryptography>=42.0.0",
]

[project.urls]
Homepage = "https://github.com/nquangdungg/zapind-py"
Repository = "https://github.com/nquangdungg/zapind-py"
Issues = "https://github.com/nquangdungg/zapind-py/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/zapind"]

[tool.hatch.build.targets.sdist]
include = [
  "src/zapind/**",
  "tests/**",
  "README.md",
  "CHANGELOG.md",
  "LICENSE",
  "pyproject.toml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
testpaths = ["tests"]
